name: Project checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d studio"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://studio:ci-test-only@127.0.0.1:5432/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.12.17
      - run: uv sync --locked
      - run: uv run --locked ruff check studio tests
      - run: uv run --locked ruff format --check studio tests
      - run: node --check studio/static/app.js
      - run: node --check studio/static/team.js
      - run: uv run --locked pytest -q
      - name: Build application image
        run: docker build -t launch-studio:ci .
